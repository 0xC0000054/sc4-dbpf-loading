Enabled=true
[Settings]
; Enables or disables a patch to the game's file writing code that optimizes
; how data larger than 512 bytes is written.
; This change affects how the game writes temporary files and save games.
;
; This patch is disabled by default (at present) due to the very slight chance
; that the patched writing code could have a data corruption bug.
; I didn't encounter any issues with the cities I tested in, but I wasn't
; testing in any that were using large amounts of custom content.
;
; The game's behavior with each value is as follows:

; False - the game uses its original behavior of splitting writes that are
; larger than 512 bytes into a series of 512 byte chunks.
; 
; True - writes larger than 512 bytes are sent to the OS without splitting
; them into chunks.
LargeWritePatch=false